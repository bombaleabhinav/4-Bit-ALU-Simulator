<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Architecture Simulators</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--glass-shadow);
            z-index: 10;
        }
        body.dark-mode .menu-container {
            background: var(--box-bg);
            border-color: var(--main-border);
        }
        .menu-btn {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.2);
            padding: 15px 30px;
            border-radius: 8px;
            font-family: var(--font-main);
            font-weight: bold;
            font-size: 1.5rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            text-decoration: none;
            color: var(--text-color);
            width: 400px;
            text-align: center;
        }
        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }
        body.dark-mode .menu-btn {
            background: rgba(30, 35, 45, 0.65);
            border-color: rgba(255, 255, 255, 0.2);
        }
        body.dark-mode .menu-btn:hover {
            background: rgba(60, 70, 85, 0.8);
        }
    </style>
</head>
<body>
    <div class="page-header">
        COMPUTER ARCHITECTURE SIMULATORS
    </div>
    <div class="page-footer">Made with &hearts; by <a href="https://github.com/bombaleabhinav" target="_blank">Abhinav</a></div>
    
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Dark/Light Mode">
        <svg viewBox="0 0 24 24" id="theme-icon">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <div class="menu-container">
        <a href="4bit-alu.html" class="menu-btn">4-Bit ALU Simulator</a>
        <a href="Booths-Multiplication/index.html" class="menu-btn">Booth's Multiplication Simulator</a>
        <a href="Restoring-Division/index.html" class="menu-btn">Restoring Division Algorithm</a>
        <a href="Non-Restoring-Division/index.html" class="menu-btn">Non-Restoring Division Algorithm</a>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        
        const moonPath = "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z";
        const sunPath = "M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z";

        function updateThemeIcon(isDark) {
            themeIcon.innerHTML = `<path d="${isDark ? sunPath : moonPath}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>`;
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            updateThemeIcon(true);
        } else {
            updateThemeIcon(false);
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            updateThemeIcon(isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    </script>
</body>
</html>
